# One-off helper: generates the initial EF Core migration with the official dotnet-ef tool and commits it.
# Runs only while the Migrations folder does not exist; it can be deleted afterwards.
name: Generate initial EF Core migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if migrations already exist
        id: check
        run: if [ -d src/EmployeeManagement.Api/Migrations ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'false'
        with:
          dotnet-version: 8.0.x
      - name: Create migration
        if: steps.check.outputs.exists == 'false'
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet ef migrations add InitialCreate --project src/EmployeeManagement.Api --output-dir Migrations
          dotnet ef migrations script --idempotent --project src/EmployeeManagement.Api --output docs/schema.sql
      - name: Commit migration
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "Rohith Mohan"
          git config user.email "152839083+Rohithmohan123@users.noreply.github.com"
          git add src/EmployeeManagement.Api/Migrations docs/schema.sql
          git commit -m "Add initial EF Core migration (generated by dotnet-ef)"
          git push
